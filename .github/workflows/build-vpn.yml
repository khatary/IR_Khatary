name: Build IR_Khatary VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vpn.yml'
      - 'README-VPN.md'

permissions:
  contents: read

jobs:
  build-vpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Android VPN client
        shell: bash
        run: |
          mkdir -p vpn/app/src/main/java/com/irkhatary/vpn vpn/app/src/main/res/values
          cat > vpn/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IR_Khatary_VPN"
          include(":app")
          EOF
          cat > vpn/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > vpn/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > vpn/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.irkhatary.vpn'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.irkhatary.vpn'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }
          }
          dependencies {
              implementation 'com.wireguard.android:tunnel:1.0.20260102'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          EOF
          cat > vpn/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="IR_Khatary VPN"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.wireguard.android.backend.GoBackend$VpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > vpn/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#16D9F5</item>
                  <item name="android:navigationBarColor">#05091A</item>
                  <item name="android:statusBarColor">#05091A</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF
          cat > vpn/app/src/main/java/com/irkhatary/vpn/MainActivity.java <<'EOF'
          package com.irkhatary.vpn;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.database.Cursor;
          import android.provider.OpenableColumns;
          import android.widget.Toast;

          import com.wireguard.android.backend.GoBackend;
          import com.wireguard.android.backend.Tunnel;
          import com.wireguard.android.backend.Statistics;
          import com.wireguard.config.Config;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int REQUEST_VPN_PERMISSION = 701;
              private static final int REQUEST_CONFIG = 702;
              private final ExecutorService worker = Executors.newSingleThreadExecutor();
              private GoBackend backend;
              private Config config;
              private File configFile;
              private Tunnel tunnel;
              private TextView status, detail, configLabel, traffic;
              private Button connectButton;
              private boolean connected = false;
              private boolean connecting = false;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(5,9,26));
                  getWindow().setNavigationBarColor(Color.rgb(5,9,26));
                  backend = new GoBackend(getApplicationContext());
                  configFile = new File(getFilesDir(), "wireguard.conf");
                  tunnel = new Tunnel() {
                      @Override public String getName() { return "IR_Khatary"; }
                      @Override public void onStateChange(State state) {
                          runOnUiThread(() -> {
                              connected = state == State.UP;
                              connecting = false;
                              renderState();
                          });
                      }
                      @Override public void onStatistics(Statistics statistics) {
                          runOnUiThread(() -> traffic.setText("دریافت: " + bytes(statistics.totalRx()) + "  •  ارسال: " + bytes(statistics.totalTx())));
                      }
                  };
                  loadSavedConfig();
                  buildUi();
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(22), dp(22), dp(22), dp(26));
                  root.setBackgroundColor(Color.rgb(5,9,26));
                  scroll.addView(root);
                  setContentView(scroll);

                  TextView brand = text("IR_Khatary", 29, true, Color.rgb(42,224,248));
                  root.addView(brand);
                  TextView subtitle = text("WIREGUARD SECURE TUNNEL", 11, true, Color.rgb(143,164,204));
                  subtitle.setLetterSpacing(0.12f);
                  root.addView(subtitle, margin(0, dp(5), 0, dp(22)));

                  LinearLayout hero = panel();
                  hero.setGravity(Gravity.CENTER);
                  hero.setPadding(dp(18), dp(24), dp(18), dp(24));
                  root.addView(hero, margin(0,0,0,dp(16)));
                  TextView shield = text("◈", 48, true, Color.rgb(36,221,247));
                  hero.addView(shield);
                  status = text("آماده اتصال", 22, true, Color.WHITE);
                  hero.addView(status, margin(0,dp(8),0,dp(5)));
                  detail = text("برای شروع، کانفیگ WireGuard خودت را وارد کن.", 13, false, Color.rgb(160,178,216));
                  detail.setGravity(Gravity.CENTER);
                  hero.addView(detail);

                  connectButton = button("اتصال امن");
                  hero.addView(connectButton, margin(0,dp(22),0,0));
                  connectButton.setOnClickListener(v -> toggleConnection());

                  LinearLayout cfg = panel();
                  cfg.setPadding(dp(16),dp(17),dp(16),dp(17));
                  root.addView(cfg, margin(0,0,0,dp(12)));
                  cfg.addView(text("پروفایل WireGuard",16,true,Color.WHITE));
                  configLabel = text("هیچ فایلی وارد نشده",12,false,Color.rgb(157,176,213));
                  cfg.addView(configLabel, margin(0,dp(9),0,dp(13)));
                  Button importButton = button("وارد کردن فایل .conf");
                  cfg.addView(importButton);
                  importButton.setOnClickListener(v -> pickConfig());

                  LinearLayout stats = panel();
                  stats.setPadding(dp(16),dp(15),dp(16),dp(15));
                  root.addView(stats, margin(0,0,0,dp(12)));
                  stats.addView(text("آمار تونل",15,true,Color.WHITE));
                  traffic = text("دریافت: —  •  ارسال: —",12,false,Color.rgb(157,176,213));
                  stats.addView(traffic, margin(0,dp(8),0,0));

                  TextView note = text("این برنامه از کتابخانه رسمی WireGuard استفاده می‌کند. برای اتصال واقعی به یک سرور فعال، فایل کانفیگ معتبر لازم است. تا زمان برقراری تونل، وضعیت متصل نمایش داده نمی‌شود.",11,false,Color.rgb(143,158,190));
                  note.setLineSpacing(dp(4),1f);
                  root.addView(note, margin(dp(3),dp(6),dp(3),0));
                  renderState();
              }

              private void loadSavedConfig() {
                  if (!configFile.isFile()) return;
                  try (InputStream in = new FileInputStream(configFile)) {
                      config = Config.parse(in);
                  } catch (Exception e) {
                      config = null;
                  }
              }

              private void pickConfig() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  startActivityForResult(intent, REQUEST_CONFIG);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_CONFIG && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      worker.execute(() -> {
                          try (InputStream in = getContentResolver().openInputStream(uri)) {
                              if (in == null) throw new IllegalStateException("فایل قابل خواندن نیست");
                              Config parsed = Config.parse(in);
                              try (InputStream saveIn = getContentResolver().openInputStream(uri);
                                   FileOutputStream out = new FileOutputStream(configFile, false)) {
                                  if (saveIn == null) throw new IllegalStateException("فایل قابل خواندن نیست");
                                  byte[] buffer = new byte[8192];
                                  int n;
                                  while ((n = saveIn.read(buffer)) > 0) out.write(buffer, 0, n);
                              }
                              config = parsed;
                              runOnUiThread(() -> {
                                  configLabel.setText("کانفیگ معتبر وارد شد (کلیدها فقط داخل حافظه خصوصی برنامه ذخیره می‌شوند).");
                                  detail.setText("کانفیگ آماده است؛ برای اتصال، ادامه بده.");
                                  Toast.makeText(this, "کانفیگ WireGuard وارد شد", Toast.LENGTH_SHORT).show();
                              });
                          } catch (Exception e) {
                              runOnUiThread(() -> new AlertDialog.Builder(this).setTitle("خطا در کانفیگ").setMessage("این فایل کانفیگ WireGuard معتبر نیست یا قابل خواندن نیست.").setPositiveButton("باشه", null).show());
                          }
                      });
                  } else if (requestCode == REQUEST_VPN_PERMISSION && resultCode == RESULT_OK) {
                      startTunnel();
                  } else if (requestCode == REQUEST_VPN_PERMISSION) {
                      connecting = false;
                      renderState();
                      Toast.makeText(this, "مجوز VPN داده نشد", Toast.LENGTH_SHORT).show();
                  }
              }

              private void toggleConnection() {
                  if (connecting) return;
                  if (connected) {
                      connecting = true;
                      renderState();
                      worker.execute(() -> {
                          try { backend.setState(tunnel, Tunnel.State.DOWN, null); }
                          catch (Exception e) { runOnUiThread(() -> Toast.makeText(this, "قطع اتصال کامل نشد", Toast.LENGTH_LONG).show()); }
                          runOnUiThread(() -> { connected = false; connecting = false; renderState(); });
                      });
                      return;
                  }
                  if (config == null) {
                      new AlertDialog.Builder(this).setTitle("کانفیگ لازم است").setMessage("برای VPN واقعی، یک فایل کانفیگ WireGuard (.conf) از سرور فعال وارد کن. این برنامه سرور رایگان را خودکار ایجاد نمی‌کند.").setPositiveButton("وارد کردن فایل", (d,w) -> pickConfig()).setNegativeButton("بعداً", null).show();
                      return;
                  }
                  Intent prepare = VpnService.prepare(this);
                  if (prepare != null) startActivityForResult(prepare, REQUEST_VPN_PERMISSION);
                  else startTunnel();
              }

              private void startTunnel() {
                  connecting = true;
                  renderState();
                  worker.execute(() -> {
                      try {
                          backend.setState(tunnel, Tunnel.State.UP, config);
                          runOnUiThread(() -> {
                              connected = backend.getRunningTunnelNames().contains(tunnel.getName());
                              connecting = false;
                              renderState();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              connected = false;
                              connecting = false;
                              renderState();
                              new AlertDialog.Builder(this).setTitle("اتصال برقرار نشد").setMessage("تونل WireGuard بالا نیامد. آدرس سرور، کلیدها، پورت و دسترسی شبکه را بررسی کن.").setPositiveButton("باشه", null).show();
                          });
                      }
                  });
              }

              private void renderState() {
                  if (status == null) return;
                  if (connecting) {
                      status.setText("در حال اتصال…");
                      detail.setText("در انتظار نتیجه واقعی تونل");
                      connectButton.setText("لطفاً صبر کن");
                  } else if (connected) {
                      status.setText("تونل محلی فعال");
                      detail.setText("وضعیت UP ثبت شده؛ پاسخ سرور و دسترسی اینترنت هنوز جداگانه تأیید نشده است.");
                      connectButton.setText("قطع اتصال");
                  } else {
                      status.setText("وصل نیست");
                      detail.setText(config == null ? "برای شروع، کانفیگ WireGuard خودت را وارد کن." : "کانفیگ بارگذاری شده؛ آماده تلاش برای اتصال.");
                      connectButton.setText("اتصال امن");
                  }
              }

              private LinearLayout panel() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                      new int[]{Color.rgb(15,29,61),Color.rgb(9,15,37)});
                  bg.setCornerRadius(dp(19));
                  bg.setStroke(dp(1), Color.rgb(31,59,103));
                  box.setBackground(bg);
                  return box;
              }
              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.rgb(3,12,27));
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{Color.rgb(39,224,246),Color.rgb(91,144,255)});
                  bg.setCornerRadius(dp(15));
                  b.setBackground(bg);
                  b.setPadding(dp(15),dp(9),dp(15),dp(9));
                  return b;
              }
              private TextView text(String value, int size, boolean bold, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  return t;
              }
              private LinearLayout.LayoutParams margin(int l,int t,int r,int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(l,t,r,b);
                  return p;
              }
              private int dp(int v) { return (int)(v*getResources().getDisplayMetrics().density+0.5f); }
              private String bytes(long n) {
                  if (n < 1024) return n + " B";
                  if (n < 1024*1024) return String.format(java.util.Locale.US,"%.1f KB",n/1024.0);
                  if (n < 1024L*1024*1024) return String.format(java.util.Locale.US,"%.1f MB",n/(1024.0*1024));
                  return String.format(java.util.Locale.US,"%.2f GB",n/(1024.0*1024*1024));
              }
              @Override protected void onDestroy() {
                  worker.shutdown();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon -p vpn assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-Khatary-VPN-v1.0-APK
          path: vpn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
