name: Build IR_Khatary VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vpn.yml'
      - 'README-VPN.md'

permissions:
  contents: read

jobs:
  build-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IR_Khatary project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Get open-source VPN Gate client and its required modules
        run: |
          # The upstream project records its submodules with SSH URLs.
          # Rewrite them to HTTPS so GitHub Actions can fetch them without SSH keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recurse-submodules https://github.com/hoang-rio/vpngate-connector.git vpn-upstream
          cd vpn-upstream
          git submodule update --init --recursive
          sed -i 's#<string name="app_name" translatable="false">VPN Gate Connector</string>#<string name="app_name" translatable="false">IR_Khatary VPN</string>#' app/src/main/res/values/strings.xml
      - name: Build integrated VPN Gate client
        working-directory: vpn-upstream
        env:
          SIGN_KEY_PASSWORD: ''
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFreeDebug
      - name: Find and upload APK
        shell: bash
        run: |
          APK="$(find vpn-upstream -path '*/build/outputs/apk/*/*/*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/IR-Khatary-VPN-v1.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IR-Khatary-VPN-v1.1.0-APK
          path: output/IR-Khatary-VPN-v1.1.0-debug.apk
          if-no-files-found: error
