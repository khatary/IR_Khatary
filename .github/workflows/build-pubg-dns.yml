name: Build PUBG DNS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PUBG-DNS/**'
      - '.github/workflows/build-pubg-dns.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: PUBG-DNS
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-DNS-debug-APK
          path: PUBG-DNS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
