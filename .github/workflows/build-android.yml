          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.irkhatary.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.irkhatary.app'
