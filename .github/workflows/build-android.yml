name: Build IR_Khatary Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'github-pages (2).zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create IR_Khatary app interface
        run: |
          mkdir -p app/src/main/assets/www app/src/main/java/com/irkhatary/app
