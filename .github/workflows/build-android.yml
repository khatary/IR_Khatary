          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android WebView app
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IR_Khatary"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.irkhatary.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.irkhatary.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          mkdir -p app/src/main/java/com/irkhatary/app
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="IR_Khatary"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/irkhatary/app/MainActivity.java <<'EOF'
          package com.irkhatary.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("file".equals(uri.getScheme())) return false;
                          if (uri.getHost() != null && (uri.getHost().equals("localhost") || uri.getHost().equals("appassets.androidplatform.net"))) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Add real DNS VPN service foundation
        run: |
          # Register the Android VPN service and permission-consent bridge.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />')
          s=s.replace('</application>','''<service android:name=".DnsVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                  </service>
              </application>''')
          p.write_text(s)
          PY
          cat > app/src/main/java/com/irkhatary/app/DnsVpnService.java <<'JAVA'
          package com.irkhatary.app;
          import android.net.VpnService;
          import android.content.Intent;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;
          import java.io.IOException;
          public class DnsVpnService extends VpnService {
              public static final String ACTION_START = "com.irkhatary.app.START_DNS";
              public static final String ACTION_STOP = "com.irkhatary.app.STOP_DNS";
              private ParcelFileDescriptor tunnel;
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  try {
                      Builder builder = new Builder()
                          .setSession("IR_Khatary DNS")
                          .addAddress("10.77.0.2", 32)
                          .addDnsServer("87.248.145.40")
                          .addDnsServer("193.242.208.98")
                          .addRoute("87.248.145.40", 32)
                          .addRoute("193.242.208.98", 32);
                      tunnel = builder.establish();
                      if (tunnel == null) { stopSelf(); return START_NOT_STICKY; }
                      // A TUN packet-processing loop is required before this can carry DNS traffic.
                      // Do not report a connected state until forwarding has been implemented.
                      Log.w("IR_KhataryDNS", "VPN interface created; DNS forwarding loop is not yet implemented.");
                      stopSelf();
                  } catch (Exception e) {
                      Log.e("IR_KhataryDNS", "Could not establish DNS interface", e);
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }
              @Override public void onDestroy() {
                  try { if (tunnel != null) tunnel.close(); } catch (IOException ignored) {}
                  super.onDestroy();
              }
          }
          JAVA
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-Khatary-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
