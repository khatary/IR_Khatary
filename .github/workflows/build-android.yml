          </style></head><body><main class="wrap"><header class="top"><div><div class="brand">IR_Khatary</div><div class="subbrand">PUBG MOBILE · DNS BOOSTER</div></div><div class="tag">GAMING MODE</div></header>
          <section class="hero"><div class="art">🎮</div><h1>آماده ورود به میدان؟</h1><div class="muted">تجربه‌ای با استایل اختصاصی<br>برای گیمرهای IR_Khatary</div><div class="orb"><button id="go" aria-label="اتصال">⏻</button></div><div class="state" id="state">وصل نیست</div><div class="hint" id="hint">برای شروع، دکمه اتصال را لمس کن</div></section>
          <section class="cards"><div class="card"><div class="ico">⚡</div><div class="ct">حالت سریع</div><div class="small">دسترسی آسان</div></div><div class="card"><div class="ico">◉</div><div class="ct">DNS گیمینگ</div><div class="small">تنظیمات داخلی</div></div><div class="card"><div class="ico">♢</div><div class="ct">رابط اختصاصی</div><div class="small">IR_Khatary</div></div></section>
          <section class="game"><div class="emoji">🪖</div><div><b>PUBG Mobile</b><span>حالت بازی · پنل IR_Khatary</span></div><div class="dot">●</div></section><div class="notice">این نسخه نمایشی است؛ دکمه اتصال فعلاً فقط وضعیت نمایشی را تغییر می‌دهد و اتصال واقعی DNS یا VPN برقرار نمی‌کند.</div><div class="foot">ساخته‌شده برای IR_Khatary · نسخه 1.0</div></main>
          <script>let on=false;document.getElementById('go').onclick=()=>{on=!on;document.getElementById('state').textContent=on?'حالت نمایشی فعال':'وصل نیست';document.getElementById('hint').textContent=on?'رابط کاربری فعال است؛ اتصال واقعی در نسخه بعدی اضافه می‌شود.':'برای شروع، دکمه اتصال را لمس کن';document.getElementById('go').style.color=on?'#2ce9a5':'white';}</script></body></html>
          HTML
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IR_Khatary"
          include(":app")
