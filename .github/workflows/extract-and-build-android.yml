name: Extract source ZIP and build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IR_Khatary_DNS_v2.zip'
      - '.github/workflows/extract-and-build-android.yml'

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract archive without editing its files
        shell: bash
        run: |
          set -euo pipefail
          test -f IR_Khatary_DNS_v2.zip
          mkdir -p /tmp/ir-khatary-source
          unzip -q IR_Khatary_DNS_v2.zip -d /tmp/ir-khatary-source
          echo "Archive entries:"
          unzip -Z1 IR_Khatary_DNS_v2.zip
          rm -rf /tmp/ir-khatary-source/.git
          cp -a /tmp/ir-khatary-source/. .
          git add -A -- . ':!.github/workflows/build.yml'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Extract Android source files from uploaded ZIP"
            git push origin HEAD:main
          else
            echo "No new extracted files to commit."
          fi

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle -o -f settings.gradle.kts
          echo "dir=." >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at repository root."

      - name: Build Android debug APK
        shell: bash
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-Khatary-Android-debug-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
