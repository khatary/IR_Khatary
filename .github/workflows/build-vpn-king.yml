name: Build VPN KING APK

on:
  push:
    branches: [vpn-king-start]
    paths:
      - "vpn_king/**"
      - ".github/workflows/build-vpn-king.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vpn_king
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.vpnking --project-name vpn_king .

      - name: Configure Android manifest and SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          s = re.sub(r'<application\\b', '<application android:extractNativeLibs="true"', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="VPN KING"', s, count=1)
          manifest.write_text(s)

          for name in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'compileSdk\\s*=\\s*(?:flutter\\.compileSdkVersion|\\d+)', 'compileSdk = 36', t)
              t = re.sub(r'compileSdkVersion\\s+(?:flutter\\.compileSdkVersion|\\d+)', 'compileSdkVersion 36', t)
              t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              t = t.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              if 'compileSdk = 36' not in t and 'compileSdkVersion 36' not in t:
                  raise SystemExit(f'Could not set compileSdk 36 in {name}')
              p.write_text(t)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-KING-apk
          path: vpn_king/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
