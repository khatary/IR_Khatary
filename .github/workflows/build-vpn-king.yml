name: Build VPN KING APK

on:
  push:
    branches: [main, vpn-king-start]
    paths:
      - "vpn_king/**"
      - ".github/workflows/build-vpn-king.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vpn_king
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.vpnking --project-name vpn_king .
      - name: Remove generated placeholder tests
        run: rm -rf test
      - name: Configure Android manifest and SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          s = re.sub(r'<application\\b', '<application android:extractNativeLibs="true"', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="VPN KING"', s, count=1)
          p.write_text(s)
          for name in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              q = Path(name)
              if q.exists():
                  t = q.read_text()
                  t = t.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  t = t.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
                  t = t.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
                  q.write_text(t)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Build release APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-KING-apk
          path: vpn_king/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
