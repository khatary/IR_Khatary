          import 'package:axevpn_flutter/openvpn_flutter.dart' as ovpn;
          import 'package:axevpn_flutter/wireguard_flutter.dart' as wireguard;

          class AltVpnManager {
            AltVpnManager({required this.onStateChanged})
                : _openVpn = ovpn.OpenVPN(
                    onVpnStageChanged: (stage, raw) {
                      _instance?._handleStage(stage.toString());
                    },
                    onVpnStatusChanged: (status) {
                      _instance?.onStateChanged();
                    },
                  ),
                  _wireGuard = wireguard.WireGuard(
                    onVpnStageChanged: (stage, raw) {
                      _instance?._handleStage(stage.toString());
                    },
                    onVpnStatusChanged: (status) {
                      _instance?.onStateChanged();
                    },
                  ) {
              _instance = this;
            }

            static AltVpnManager? _instance;
            final void Function() onStateChanged;
            final ovpn.OpenVPN _openVpn;
            final wireguard.WireGuard _wireGuard;
            bool _initialized = false;
            bool connected = false;
            bool connecting = false;
            String? _activeProtocol;
            bool get isActive => _activeProtocol != null;

            void _handleStage(String value) {
              final stage = value.toLowerCase();
              connected = stage.contains('connected') && !stage.contains('disconnected');
              connecting = !connected && (stage.contains('connect') || stage.contains('prepar'));
              if (stage.contains('disconnected') || stage.contains('error') || stage.contains('denied')) {
                connected = false;
                connecting = false;
                if (stage.contains('disconnected')) _activeProtocol = null;
              }
              onStateChanged();
            }

            Future<void> _initialize() async {
              if (_initialized) return;
              await _openVpn.initialize();
              await _wireGuard.initialize();
              _initialized = true;
            }

            Future<void> connect(String protocol, String config, String name) async {
              await _initialize();
              _activeProtocol = protocol;
              connected = false;
              connecting = true;
              onStateChanged();
              try {
                if (protocol == 'OPENVPN') {
                  final granted = await _openVpn.requestPermissionAndroid();
                  if (!granted) throw Exception('مجوز VPN داده نشد');
                  await _openVpn.connect(config, name);
                } else if (protocol == 'WIREGUARD') {
                  await _wireGuard.connect(config, name);
                } else {
                  throw ArgumentError('Unsupported VPN protocol: ' + protocol);
                }
              } catch (_) {
                connecting = false;
                connected = false;
                _activeProtocol = null;
                onStateChanged();
                rethrow;
              }
            }

            Future<void> disconnect() async {
              final active = _activeProtocol;
              if (active == 'OPENVPN') {
                _openVpn.disconnect();
              } else if (active == 'WIREGUARD') {
                await _wireGuard.disconnect();
              }
              _activeProtocol = null;
              connected = false;
              connecting = false;
              onStateChanged();
            }
          }
          DART
