name: Import VPN KING and build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'vpn_king.zip'
      - '.github/workflows/import-vpn-king.yml'
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Extract VPN KING ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f vpn_king.zip
          rm -rf /tmp/vpn-king-import
          mkdir -p /tmp/vpn-king-import
          unzip -q vpn_king.zip -d /tmp/vpn-king-import
          test -f /tmp/vpn-king-import/vpn_king/pubspec.yaml
          test -f /tmp/vpn-king-import/vpn_king/lib/main.dart
          rm -rf vpn_king
          cp -a /tmp/vpn-king-import/vpn_king ./vpn_king
      - name: Generate Android platform if missing
        working-directory: vpn_king
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name vpn_king .
          fi
      - name: Force compileSdk 36
        working-directory: vpn_king
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for p in files:
              if not p.exists():
                  continue
              found = True
              s = p.read_text()
              if p.suffix == ".kts":
                  s, n = re.subn(r'(?m)^\s*compileSdk\s*=.*$', '    compileSdk = 36', s)
                  if n == 0:
                      s = re.sub(r'(?m)^\s*compileSdkVersion\s+.*$', '    compileSdk = 36', s)
              else:
                  s, n = re.subn(r'(?m)^\s*compileSdkVersion\s+.*$', '    compileSdkVersion 36', s)
                  if n == 0:
                      s = re.sub(r'(?m)^\s*compileSdk\s*=.*$', '    compileSdkVersion 36', s)
              p.write_text(s)
              print(p, [line.strip() for line in s.splitlines() if 'compileSdk' in line])
          if not found:
              raise SystemExit("Android app Gradle file not found")
          combined = '\n'.join(p.read_text() for p in files if p.exists())
          if not re.search(r'compileSdk\s*=\s*36|compileSdkVersion\s+36', combined):
              raise SystemExit("compileSdk 36 was not applied")
          PY
      - name: Resolve Flutter dependencies
        working-directory: vpn_king
        run: flutter pub get
      - name: Verify compileSdk
        working-directory: vpn_king
        run: grep -R -nE 'compileSdk(Version)?[ =]+36' android/app
      - name: Commit imported source and Android config
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vpn_king
          if ! git diff --cached --quiet; then
            git commit -m "Import VPN KING and set Android compile SDK 36"
            git push origin HEAD:main
          fi
      - name: Build release APK
        working-directory: vpn_king
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-KING-release
          path: vpn_king/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
