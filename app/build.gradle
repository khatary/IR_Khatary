plugins { id 'com.android.application' }

android {
    namespace 'com.irkhatary.dns'
    compileSdk 35

    defaultConfig {
        applicationId 'com.irkhatary.dns'
        minSdk 21          // Android 5.0+ (covers ~99% of active phones)
        targetSdk 35
        versionCode 8
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}
